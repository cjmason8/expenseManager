# Root S3 key prefix (within aws.s3.bucket) for all documents, e.g. expenseManager or org/expenseManager
docs.location=${DOCS_LOCATION:expenseManager}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.main.allow-circular-references=true

management.endpoints.web.expose.include=health,info
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/

# S3
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.backup-bucket=${AWS_S3_BACKUP_BUCKET:expense-manager-backups}
aws.s3.region=${AWS_S3_REGION:ap-southeast-2}
# Optional: custom endpoint (e.g. LocalStack) and path-style URLs
aws.s3.endpoint=${AWS_S3_ENDPOINT:}
aws.s3.path-style-access=${AWS_S3_PATH_STYLE:false}

# AWS Secrets Manager (also used as AWS credentials for S3)
aws.secrets.region=ap-southeast-2
aws.secrets.access-key=${AWS_ACCESS_KEY_ID:}
aws.secrets.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.secrets.session-token=${AWS_SESSION_TOKEN:}
email.secret.name=${EMAIL_SECRET_NAME:email-credentials}
email.payslip.secret.name=${EMAIL_PAYSLIP_SECRET_NAME:email-payslip-credentials}
database.secret.name=${DATABASE_SECRET_NAME:local-database-credentials}
backup.timezone=${BACKUP_TIMEZONE:Australia/Melbourne}
# TODO: revert after testing — production: daily 0 30 23 * * *, weekly 0 35 23 * * SUN
backup.daily.cron=${BACKUP_DAILY_CRON:0 42 14 * * *}
backup.weekly.cron=${BACKUP_WEEKLY_CRON:0 35 23 * * SUN}
backup.pg-dump.mode=${BACKUP_PG_DUMP_MODE:direct}
backup.docker.image-match=${BACKUP_DOCKER_IMAGE_MATCH:postgres:13.4-alpine}
backup.docker.username=${BACKUP_DOCKER_PG_USER:postgres}
backup.docker.database=${BACKUP_DOCKER_PG_DATABASE:expensemanager}
env=${ENV:local}

# Cognito JWT validation (access tokens from the SPA app client)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.ap-southeast-2.amazonaws.com/ap-southeast-2_qDA8JIm05}
# Set to false to disable JWT checks during local dev (e.g. before frontend sends Bearer tokens)
app.security.cognito-enabled=${COGNITO_SECURITY_ENABLED:true}
